[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zypg"
version = "0.1.0"
description = "作业批改多智能体"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "cryptography>=42",
  "redis>=5.0",
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "openpyxl>=3.1",
  "pillow>=10.2",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "streamlit>=1.32",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
zypg = "zypg.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
